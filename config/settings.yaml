# ==============================================================================
# CẤU HÌNH CHUNG AI_VIDEO_STUDIO
# Thể loại / phong cách vẽ / giọng đọc của từng bộ truyện nằm trong
# projects/<du_an>/series.yaml (tool tự điền khi chạy lần đầu).
# ==============================================================================

paths:
  projects_dir: "projects"

# --- Tự nâng chất lượng theo cấu hình pod ---
# Tool đo VRAM/RAM của pod khi chạy rồi áp mức cao nhất đáp ứng được (các mức xếp từ thấp lên cao).
# "set" ghi đè các giá trị bên dưới theo đường dẫn a.b.c. Model Ollama của mức được chọn sẽ được
# setup tự tải thêm (vẫn giữ bản mặc định làm dự phòng). Tắt: auto: false.
quality:
  auto: true
  tiers:
    - name: "thường"            # A40 (46 GB RAM), RTX PRO 4500/4090...: 480p, LLM 14B
      min: {vram_gb: 0, ram_gb: 0}
      set: {}
    - name: "cao"               # L40S / RTX 6000 Ada (48 GB) có RAM >= 60 GB: video 720p, LLM đạo diễn 32B
      min: {vram_gb: 44, ram_gb: 60}
      set:
        motion.wan22_14b.width: 1280
        motion.wan22_14b.height: 720
        motion.s2v.width: 1024
        motion.s2v.height: 576
        ollama.model: "qwen2.5:32b"
    - name: "tối đa"            # RTX PRO 6000 / H100 / A100 80 GB+: 720p cả nhép miệng, LLM 72B, VLM 32B
      min: {vram_gb: 80, ram_gb: 120}
      set:
        motion.wan22_14b.width: 1280
        motion.wan22_14b.height: 720
        motion.s2v.width: 1280
        motion.s2v.height: 720
        ollama.model: "qwen2.5:72b"
        ollama.vision_model: "qwen2.5vl:32b"
        qa.min_score: 7

# --- LLM đạo diễn + model thị giác kiểm tra ảnh (chạy local trong Ollama) ---
ollama:
  host: "http://127.0.0.1:11434"
  model: "qwen2.5:14b"          # VRAM >= 24GB có thể dùng "qwen2.5:32b" để hiểu truyện tốt hơn
  vision_model: "qwen2.5vl:7b"  # dùng cho QA ảnh và chọn ảnh casting
  temperature: 0.2
  timeout_seconds: 300
  retries: 2
  num_ctx: 16384                # Ollama mặc định chỉ 2048-4096 token -> prompt dài bị cắt

director:
  analysis_chapters: 3          # số chương đầu dùng để nhận diện thể loại/thời đại
  analysis_sample_chars: 6000
  character_scan_chars: 9000    # cửa sổ quét Story Bible
  scene_target_chars: 170       # ~10-11 giây lời đọc mỗi cảnh: cắt cảnh nhiều hơn như phim
  scene_max_chars: 280
  batch_size: 6                 # số cảnh mỗi lần gọi LLM
  max_visible_characters: 2
  allow_crowds: false
  auto_era: true                # truyện đô thị nhắc nhiều năm thuộc thập kỷ khác -> tự đổi preset chương đó
                                # (bị tắt khi series.yaml có genre_by_chapter)

# --- Giọng đọc OmniVoice ---
tts:
  model_id: "k2-fsa/OmniVoice"  # có thể thử bản fine-tune tiếng Việt: termanteus/omnivoice-vietnamese
  sample_rate: 24000
  speed: 1.0
  num_step: 32                  # 16 nhanh hơn, 48-64 mượt hơn
  guidance_scale: 2.0           # 2.5-3.0 bám giọng mẫu chặt hơn
  seed: 1234                    # seed cố định -> ngữ điệu ổn định giữa các câu
  max_chars: 160                # chunk ngắn giảm nuốt chữ
  merge_sentences: true
  trim_silence_db: -42          # cắt khoảng lặng TTS tự sinh
  lead_ms: 30
  tail_ms: 60
  fade_ms: 10
  pauses_ms:                    # nhịp nghỉ sau chunk theo dấu câu
    comma: 150
    sentence: 300
    question: 380
    ellipsis: 520
    paragraph: 600
    dialogue: 680
    title: 1200

# --- Nghe lại bằng ASR để bắt lỗi vấp/nuốt chữ ---
asr:
  enabled: true
  model_id: "vinai/PhoWhisper-large"
  max_cer: 0.15                 # tỷ lệ sai ký tự tối đa (tên riêng Hán Việt làm CER cao hơn thực tế)
  max_attempts: 3
  cps_min: 7                    # ký tự/giây: thấp hơn = kéo dài/lặp, cao hơn = nuốt chữ
  cps_max: 28

# --- Tạo ảnh qua ComfyUI ---
comfyui:
  host: "http://127.0.0.1:8188"
  timeout_seconds: 600

image:
  workflow: "qwen_image"        # qwen_image | sdxl | đường dẫn workflow API JSON tự xuất từ ComfyUI
  edit_workflow: "qwen_image_edit"   # giữ mặt nhân vật từ ảnh mẫu; để "" để tắt
  use_reference_edit: true
  single_model: true            # Qwen-Image-Edit vẽ cả cảnh không có nhân vật: một model duy nhất, không phải nạp lại
                                # (đo: đổi Qwen-Image <-> Edit mất ~6 phút/lần khi model nằm trên volume mạng)
  width: 1664
  height: 928
  qwen_image:
    unet: "qwen_image_fp8_e4m3fn.safetensors"
    clip: "qwen_2.5_vl_7b_fp8_scaled.safetensors"
    vae: "qwen_image_vae.safetensors"
    lora: "Qwen-Image-Lightning-8steps-V1.0.safetensors"   # "" = không dùng Lightning (khi đó steps 20-30, cfg 2.5)
    lora_strength: 1.0
    shift: 3.1
    steps: 8
    cfg: 1.0
    steps_no_lora: 24             # dùng khi thiếu file LoRA Lightning
    cfg_no_lora: 2.5
    sampler: "euler"
    scheduler: "simple"
  qwen_image_edit:
    unet: "qwen_image_edit_2509_fp8_e4m3fn.safetensors"
    clip: "qwen_2.5_vl_7b_fp8_scaled.safetensors"
    vae: "qwen_image_vae.safetensors"
    lora: "Qwen-Image-Edit-2509-Lightning-8steps-V1.0-bf16.safetensors"   # "" = không Lightning (khi đó steps 20, cfg 2.5: chậm ~10 lần)
    lora_strength: 1.0
    shift: 3.0
    steps: 8
    cfg: 1.0
    steps_no_lora: 20
    cfg_no_lora: 2.5
    sampler: "euler"
    scheduler: "simple"
  sdxl:                          # dự phòng khi pod thiếu model Qwen
    checkpoint: "sd_xl_base_1.0.safetensors"
    width: 1344
    height: 768
    steps: 30
    cfg: 6.0
    sampler: "dpmpp_2m"
    scheduler: "karras"

# --- Tự kiểm tra ảnh bằng model thị giác, ảnh lỗi được vẽ lại ---
qa:
  enabled: true
  min_score: 6
  max_rounds: 2
  reject_text: true

# --- Tự sinh ảnh mẫu khuôn mặt cho nhân vật quan trọng ---
casting:
  enabled: true
  candidates: 3
  min_mentions: 2
  min_scenes: 2
  max_per_chapter: 6

# --- Chuyển động (Wan 2.2) ---
# Chế độ phim: mọi cảnh đều chuyển động. Cảnh dài được phủ bằng nhiều clip nối tiếp
# (clip sau bắt đầu từ khung cuối clip trước, theo các nhịp hành động của đạo diễn).
# Cảnh có nhân vật nói thoại (một mình trong khung) dùng Wan 2.2 S2V để nhép miệng theo giọng đọc.
motion:
  enabled: true
  model: "auto"                 # auto = tự chọn theo VRAM/RAM của pod (xem auto bên dưới) | wan22_14b | wan22_5b
                                # Thiếu file model nào thì tự lùi sang model còn lại, cuối cùng là Ken Burns.
  auto:                         # ngưỡng tự chọn (pod yếu hơn -> Wan 5B, không nhép miệng)
    wan14b_min: {vram_gb: 20, ram_gb: 40}
    s2v_min: {vram_gb: 24, ram_gb: 40}
  coverage: "all"               # all = mọi cảnh | ratio = chỉ một phần cảnh (xem ratio)
  ratio: 0.25
  min_priority: 1
  chain: true                   # nối nhiều clip để phủ kín cảnh dài
  max_clips_per_scene: 4
  max_slowdown: 1.2             # clip được kéo chậm tối đa 1.2 lần trước khi cần thêm clip
  lipsync: true                 # nhép miệng bằng S2V (cần INSTALL_S2V=1)
  timeout_seconds: 1500
  frames: 81
  fps: 16
  wan22_14b:
    high_noise_model: "wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors"
    low_noise_model: "wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors"
    high_noise_lora: "wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors"
    low_noise_lora: "wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors"
    text_encoder: "umt5_xxl_fp8_e4m3fn_scaled.safetensors"
    vae: "wan_2.1_vae.safetensors"
    width: 832                  # 832x480 rồi phóng lên 1080p khi dựng; 1280x720 đẹp hơn nhưng chậm ~2.2 lần
    height: 480
    frames: 81                  # ~5 giây @16fps
    fps: 16
    steps: 4
    split_step: 2
    cfg: 1.0
    shift: 5.0
    sampler: "euler"
    scheduler: "simple"
  wan22_5b:
    diffusion_model: "wan2.2_ti2v_5B_fp16.safetensors"
    text_encoder: "umt5_xxl_fp8_e4m3fn_scaled.safetensors"
    vae: "wan2.2_vae.safetensors"
    width: 1024
    height: 576
    frames: 97
    fps: 24
    steps: 20
    cfg: 5.0
    shift: 8.0
    sampler: "uni_pc"
    scheduler: "simple"
  s2v:                          # theo template chính thức video_wan2_2_14B_s2v của ComfyUI
    enabled: true
    model: "wan2.2_s2v_14B_fp8_scaled.safetensors"
    audio_encoder: "wav2vec2_large_english_fp16.safetensors"
    lora: "wan2.2_t2v_lightx2v_4steps_lora_v1.1_high_noise.safetensors"
    lora_strength: 1.0
    text_encoder: "umt5_xxl_fp8_e4m3fn_scaled.safetensors"
    vae: "wan_2.1_vae.safetensors"
    width: 832
    height: 480
    chunk_frames: 77            # mỗi đoạn ~4.8 giây, tự nối thêm đoạn cho thoại dài
    max_chunks: 8
    fps: 16
    steps: 4
    cfg: 1.0
    shift: 8.0
    sampler: "uni_pc"
    scheduler: "simple"

# --- Dựng phim ---
video:
  fps: 30
  resolution: [1920, 1080]
  encoder: "auto"               # auto (NVENC nếu có) | libx264
  cq: 20                        # chất lượng NVENC (thấp = đẹp hơn)
  crf: 20                       # chất lượng libx264
  x264_preset: "medium"
  transition_sec: 0.5           # crossfade giữa các cảnh
  motion_max_slowdown: 1.25     # kéo chậm clip AI tối đa 1.25 lần, phần dư dùng Ken Burns
  loudness_lufs: -16
  ken_burns:
    zoom: 1.12
    supersample: 2              # phóng to trước khi zoom để không rung hình
  bgm:
    enabled: true
    dir: "assets/bgm"           # assets/bgm/<bgm_mood>/*.mp3 hoặc assets/bgm/*.mp3
    volume_db: -22
  subtitle:
    enabled: true
    font_name: "Noto Sans"
    font_size: 54
    primary_color: "&H0000FFFF"  # vàng (ASS dạng &HAABBGGRR)
    outline_color: "&H00000000"
    outline_width: 3
    shadow: 1
    margin_v: 60
    max_chars_per_line: 42
    max_lines: 2

episodes:
  chapters_per_episode: 10      # mặc định; series.yaml có thể ghi đè

# --- Google Drive qua rclone ---
upload:
  enabled: true
  remote: "gdrive"              # tên remote trong rclone.conf
  # Thư mục gốc trên Drive theo ID (link drive.google.com/drive/folders/<ID>).
  # Mỗi bộ truyện tự có thư mục con mang tên truyện: <Tên truyện>/ (video tập),
  # <Tên truyện>/review/ (storyboard, báo cáo), <Tên truyện>/chapters/ (nếu upload_chapters).
  root_folder_id: "1Y8HB6uJQXZDYvssRodvvNqzCrzMqsgP7"
  remote_dest: "gdrive:AI_Video_Studio_Output"   # chỉ dùng khi root_folder_id để trống
  config_path: "rclone.conf"
  upload_chapters: false        # true: upload cả video từng chương
  upload_storyboards: true      # upload storyboard + báo cáo để duyệt từ xa
  delete_local_episode: true    # xóa video tập trên pod sau khi upload thành công
  cleanup_after_upload: true    # tập đã lên Drive: các chương của tập được đánh dấu .done, xóa ảnh/clip/audio/video
                                # trung gian (~1 GB/chương) và lần chạy sau tự bỏ qua (làm lại: --force done)

runpod:
  stop_pod_when_done: false     # true: tự tắt pod khi chạy xong (cần runpodctl)
